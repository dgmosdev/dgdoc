version: 2

before:
  hooks:
    - go mod tidy
    # - go test ./... # Release step should assume tests passed in CI

builds:
  - id: "dgdoc"
    binary: "dgdoc"
    main: "./cmd/dgdoc"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    # this name template makes the archives generated use the name containing the OS/Arch
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats:
        - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

brews:
  -
    name: dgdoc
    repository:
      owner: dgmosdev
      name: homebrew-tap
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/dgmosdev/dgdoc"
    description: "Go package and CLI tool for templating DOCX, PPTX, XLSX, and ODT files."
    license: "MIT"
    directory: Formula
    caveats: "Run 'dgdoc --help' to see usage examples."
    install: |
      bin.install "dgdoc"
